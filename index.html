<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(function(){});
}
try { if (typeof load === 'function') load(); if (typeof R === 'function') R(); }
catch (e) {
  var app = document.getElementById('app');
  app.innerHTML = '<div style="padding:24px;font-family:system-ui;color:#c8102e"><h2>App Error</h2><p>'+(e && e.message ? e.message : String(e))+'</p><p style="color:#666;font-size:12px">Modules are not yet populated. Open the browser console for details.</p></div>';
  if (window.console) console.error('[RRE] boot failed:', e);
}
</script>
